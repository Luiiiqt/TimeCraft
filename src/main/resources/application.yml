server:
  port: 8080

spring:
  application:
    name: timecraft

  spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/timecraft_db
    username: timecraft
    password: timecraft
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:timecraft-super-secret-key-change-in-production-32chars}
    expiration-ms: 86400000

  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics