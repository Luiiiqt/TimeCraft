  server:
    port: 8080

  logging:
    level:
      org.flywaydb: DEBUG

  spring:
    mail:
      host: ${MAIL_HOST:smtp.gmail.com}
      port: 587
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      properties:
        mail.smtp.auth: true
        mail.smtp.starttls.enable: true

  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics