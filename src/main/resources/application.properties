spring.application.name=timecraft
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:postgresql://db:5432/timecraft_db
spring.datasource.username=timecraft
spring.datasource.password=timecraft123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.jwt.secret=timecraft-super-secret-key-change-in-production-32chars
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=http://localhost:5173
ollama.base-url=http://localhost:11434
ollama.model=llama3.2
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null
spring.jpa.defer-datasource-initialization=true