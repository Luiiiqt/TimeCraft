spring.application.name=timecraft
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/timecraft_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000 }
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null
spring.jpa.defer-datasource-initialization=true