version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: timecraft_db
    environment:
      POSTGRES_DB: timecraft_db
      POSTGRES_USER: timecraft
      POSTGRES_PASSWORD: timecraft123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timecraft -d timecraft_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: timecraft_backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/timecraft_db
      SPRING_DATASOURCE_USERNAME: timecraft
      SPRING_DATASOURCE_PASSWORD: timecraft123
      SPRING_JPA_HIBERNATE_DDL_AUTO: none

  frontend:
    build: ./frontend
    container_name: timecraft_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: